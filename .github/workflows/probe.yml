name: probe
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run probes from probe_config.txt
        run: |
          set +e
          mkdir -p out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          : > out/all.log
          : > out/cookies.txt
          echo "RUNNER_IP: $(curl -s -m 10 https://ipinfo.io/json | head -c 300)" >> out/all.log
          while IFS=$'\t' read -r name method url body; do
            [ -z "$name" ] && continue
            case "$name" in \#*) continue;; esac
            echo "=== $name | $method | $url" >> out/all.log
            args=(-sS -m 25 --http2 -A "$UA" -H "Accept: application/json" \
                  -H "Origin: https://fiestalabs.aifiesta.ai" \
                  -H "Referer: https://fiestalabs.aifiesta.ai/" \
                  -c out/cookies.txt -b out/cookies.txt \
                  -D "out/${name}.headers" -o "out/${name}.body" -w "HTTPCODE:%{http_code} TIME:%{time_total}\n")
            if [ "$method" = "POST" ]; then
              args+=(-H "Content-Type: application/json" -d "$body")
            fi
            curl "${args[@]}" "$url" >> out/all.log 2>&1
            echo "CURLRC=$?" >> out/all.log
            echo "  --> body-head: $(head -c 300 out/${name}.body | tr '\n' ' ')" >> out/all.log
          done < probe_config.txt
          echo "PROBES COMPLETE $(date -u)"
      - name: publish results to gist
        run: |
          FILES_JSON=$(python3 - <<'PY'
import json, glob, os
files = {}
for p in sorted(glob.glob('out/*')):
    n = os.path.basename(p)
    try:
        with open(p, errors='replace') as f:
            files[n] = {"content": f.read()}
    except Exception:
        files[n] = {"content": "<binary>"}
print(json.dumps({"description": "aifi probe results", "files": files}))
PY
)
          curl -s -X PATCH -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/04643c179b6ee0267cbfe900a3550840" -d "$FILES_JSON" \
            -o out/gist_resp.json -w "GIST_HTTP:%{http_code}\n"
          echo "GIST DONE"
